# no_ble.conf — overlay config for board targets with no Bluetooth radio.
#
# Use with the STM32WLE5 second-source target:
#
#     west build -b nucleo_wl55jc -- -DEXTRA_CONF_FILE=no_ble.conf
#
# The STM32WLE5 (RAK3172, Wio-E5) is a single die with a sub-GHz radio and no
# Bluetooth controller, so prj.conf's BLE block cannot be satisfied there. This
# file turns it off rather than editing prj.conf, so the RAK4631 primary target
# is unaffected.
#
# WHAT IS LOST, stated plainly because it is a product decision and not a build
# detail: mcumgr-over-BLE goes away with CONFIG_BT, and with it the field
# recovery path — an installer standing at a node bricked by a bad OTA has no
# way in without a WAN and a gateway. 05-open-source-stack.md §5.1 calls that
# path "the difference between a bad OTA being an incident and being a
# mass-flooding liability event", and 08-roadmap.md §4 lists MCUboot +
# mcumgr/BLE as a P2 deliverable.
#
# So this configuration is for bring-up and for proving the firmware ports to
# the second source. If the shipping part must have both radios, the answer is
# the RAK11720 at $7.99 rather than this config
# (06-hardware-and-devkits.md; 08-roadmap.md §3 P2).

CONFIG_BT=n
CONFIG_BT_PERIPHERAL=n
CONFIG_BT_SMP=n
CONFIG_MCUMGR_TRANSPORT_BT=n

# MCUboot itself stays. Signed A/B images with rollback are worth having even
# when the only transport is a cable: the trust format is what makes a bad
# image recoverable rather than terminal.
