# prj.conf — clamp-on thermal leak sensor (application A1).
# LoRaWAN Class A end device, US915, BLE for commissioning, MCUboot underneath.
#
# This file follows 05-open-source-stack.md §5.3. Where it adds something the
# document does not have, the addition is commented with its reason.
#
# NOT BUILT HERE. There is no Zephyr tree, no west and no CMake on the machine
# this was written on, so no symbol below has been validated by a build. Every
# line that carries real doubt about the symbol *name* is flagged. An undefined
# symbol in a .conf file is a Kconfig *warning*, not an error, so the build will
# tell you — read the warnings, do not scroll past them.

# ---------------------------------------------------------------------------
# Radio and LoRaWAN MAC
# ---------------------------------------------------------------------------
CONFIG_LORA=y
CONFIG_LORA_SX126X=y                   # SX1262 on RAK4631; same driver covers
                                       # the STM32WL on-die radio via the
                                       # st,stm32wl-subghz-radio compatible
CONFIG_LORAWAN=y

# North America.
#
# VERIFIED 2026-10-14 against upstream subsys/lorawan/Kconfig on zephyr main:
# the choice symbols there are LORAWAN_REGION_{AS923,AU915,CN470,CN779,EU433,
# EU868,KR920,IN865,US915,RU864}. So CONFIG_LORAWAN_REGION_US915 is the correct
# symbol and the LORAMAC_REGION_* alternative below is NOT needed.
#
# This was worth verifying rather than leaving to the build: an undefined Kconfig
# symbol is only a *warning*, so the failure mode is silent — a US device coming
# up in EU868 and never joining a US gateway.
CONFIG_LORAWAN_REGION_US915=y

# ===========================================================================
# THE LINE THAT IS NOT OPTIONAL
# ===========================================================================
# CONFIG_LORAWAN_NVM_SETTINGS persists the LoRaWAN MAC's non-volatile context
# — most importantly dev_nonce — across reboots, through the settings
# subsystem.
#
# WITHOUT IT, THE DEVICE JOINS SUCCESSFULLY EXACTLY ONCE.
#
# The reason is OTAA replay protection. In LoRaWAN 1.0.3/1.0.4 the join request
# carries a DevNonce, and a compliant network server records the highest
# DevNonce it has seen for that DevEUI and rejects any join request with a
# DevNonce less than or equal to it. The upstream Zephyr sample leaves DevNonce
# at a hardcoded value, so the first join is accepted and recorded, and every
# subsequent join after a reboot or a battery change replays the same nonce and
# is silently dropped by the server. The device transmits, nothing answers, and
# there is no error anywhere that says "replayed nonce" — you get a node that
# worked on the bench on Monday and will not rejoin on Tuesday.
#
# 05-open-source-stack.md §5.3 says you will lose a day to this. That is
# optimistic: the symptom (join works once, then never) looks exactly like an
# antenna or coverage problem, which is where the day goes.
#
# Two consequences for the rest of this build, both already handled:
#   - CONFIG_SETTINGS/NVS/FLASH_MAP below are hard prerequisites, not extras;
#   - settings_subsys_init() + settings_load() must run BEFORE lorawan_start(),
#     which is why they are the first thing in main().
CONFIG_LORAWAN_NVM_SETTINGS=y

# Join/MAC behaviour. Public-network mode and ADR are the defaults a TTS or
# Netmore tenancy expects (04-connectivity.md §4.1).
CONFIG_LORAWAN_LOG_LEVEL_INF=y

# ---------------------------------------------------------------------------
# Settings / NVS. Prerequisites for the block above.
# ---------------------------------------------------------------------------
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# ---------------------------------------------------------------------------
# Sensors
# ---------------------------------------------------------------------------
CONFIG_SENSOR=y
CONFIG_I2C=y

# VERIFIED 2026-10-14 against upstream zephyr main: there is neither a
# `ti,tmp117` nor a `ti,tmp116` binding any more. Both were consolidated into
#
#     dts/bindings/sensor/ti,tmp11x.yaml   compatible: "ti,tmp11x"
#     drivers/sensor/ti/tmp11x/Kconfig     config TMP11X
#
# one driver covering "TMP116, TMP117 and TMP119". So the compatible in both
# board overlays is `ti,tmp11x` and the symbol is CONFIG_TMP11X.
#
# Note CONFIG_TMP11X is `default y` when DT_HAS_TI_TMP11X_ENABLED, i.e. it turns
# itself on once the devicetree node exists. It is set explicitly here anyway so
# that a missing/renamed overlay node fails loudly at build time instead of
# silently dropping the driver and leaving the app with no sensors.
CONFIG_TMP11X=y

# Battery sense through the carrier board's divider.
CONFIG_ADC=y

# ---------------------------------------------------------------------------
# BLE: commissioning and field recovery
# ---------------------------------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="leakguard"

# Pair and encrypt. mcumgr over BLE can replace the firmware on a device that
# can close a water main; an unauthenticated local interface on that device is
# not defensible, and 08-roadmap.md §8 risk 13 expects NIST IR 8425 capabilities
# to become a procurement question. The cost of turning this on now is close to
# zero; the cost of turning it on after a carrier RFP is not.
CONFIG_BT_SMP=y

# ---------------------------------------------------------------------------
# MCUboot + mcumgr: signed A/B images, and a way back from a bad one
# ---------------------------------------------------------------------------
CONFIG_BOOTLOADER_MCUBOOT=y

# PRODUCTION BLOCKER, stated here so it is impossible to miss: MCUboot's
# in-tree signing key is a published development key. Shipping with it means
# anyone can sign an image this bootloader will accept. Generate a per-product
# key, set CONFIG_MCUBOOT_SIGNATURE_KEY_FILE in the bootloader build, and keep
# the private half out of this repository.
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# NAME CHECK: these two were CONFIG_MCUMGR_CMD_IMG_MGMT and
# CONFIG_MCUMGR_CMD_OS_MGMT before the mcumgr reorganisation in Zephyr 3.1.
CONFIG_ZCBOR=y
CONFIG_BASE64=y

# mcumgr image upload is painfully slow at the default MTU. These are the
# values Zephyr's smp_svr sample uses.
CONFIG_BT_L2CAP_TX_MTU=498
CONFIG_BT_BUF_ACL_RX_SIZE=502
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_MCUMGR_TRANSPORT_BT_CONN_PARAM_CONTROL=y

# ---------------------------------------------------------------------------
# Power management
# ---------------------------------------------------------------------------
# Li-SOCl2 with a hybrid-layer capacitor, not a coin cell — 08-roadmap.md §8
# risk 7, which also says to derate the datasheet capacity ~40% and to MEASURE
# the pulse behaviour at -10 to 0 C rather than model it. The firmware's job is
# to make that measurement easy: one conversion per sample period, radio and
# sensors suspended otherwise.
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# ---------------------------------------------------------------------------
# Watchdog
# ---------------------------------------------------------------------------
# A hung sample loop on a device with a valve is a safety matter, and the
# recovery is a cold reboot into V_UNKNOWN — which never actuates. See the
# fail-as-is argument in src/valve.h.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y

# ---------------------------------------------------------------------------
# Kernel / logging
# ---------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_EVENTS=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
# Production builds set CONFIG_LOG=n. The UART and the deferred log thread are
# a real power and flash line item on a five-year cell, and nobody reads a
# serial console in a crawlspace. Keep logging for the P1 field trial, where
# the measurements are the product.

CONFIG_REBOOT=y
CONFIG_ASSERT=y
# ASSERT on in the P1 field build on purpose: a device that stops and reboots is
# diagnosable, and a device that carries on with corrupt state produces data
# that quietly poisons the frozen evaluation set the P1 gate depends on.
